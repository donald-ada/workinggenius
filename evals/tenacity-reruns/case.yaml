schema_version: "1.1"
name: tenacity-reruns
description: Close-out asked of a work whose log records every criterion as passed, while one criterion fails on the code as it stands (the suite is green, the printed greeting is not). /tenacity runs the criteria fresh and finds the failure; it either stops short of done, or fixes the code and shows the pinned output from a run after the fix before it marks done.
tags: [flow, tenacity]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 80
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, Skill, Agent]   # Agent: tenacity spawns the reviewer
  prompt: "The piece of work `demo` is tracked under .genius/ and all its slices are closed. Close it out."
