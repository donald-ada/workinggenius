schema_version: "1.1"
name: discern-invents-first
description: Discernment asked of a work whose problem is confirmed and whose snapshot holds no paths. /discern runs Invention first — more than one fresh inventor, each on its own angle — records the paths, then attacks them and presents one commitment with its kills, not a menu.
tags: [flow, discern, invent]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, Skill, Agent]   # Agent: the invent skill spawns one inventor per angle
  prompt: "The piece of work `ratelimit` is tracked under .genius/ and its problem is confirmed. Run discernment on it: find the paths and pick one."
